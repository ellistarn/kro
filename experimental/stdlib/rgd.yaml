# ResourceGraphDefinition Controller
#
# Raw Graph that implements the RGD type. Validation runs in the parent
# graph (rgd-controller) and gates sub-Graph creation. The rgdPatch node
# is the single writer for Ready, state, and Compiled on the RGD.
---
apiVersion: experimental.kro.run/v1alpha1
kind: Graph
metadata:
  name: rgd
  namespace: kro-system
spec:
  nodes:
    - id: rgdCrd
      template:
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: resourcegraphdefinitions.kro.run
        spec:
          group: kro.run
          names:
            plural: resourcegraphdefinitions
            singular: resourcegraphdefinition
            kind: ResourceGraphDefinition
            listKind: ResourceGraphDefinitionList
          scope: Cluster
          versions:
            - name: v1alpha1
              served: true
              storage: true
              schema:
                openAPIV3Schema: >-
                  ${simpleSchema.toOpenAPI({"types": {"ExternalRefMetadata": {"name": "string", "namespace": "string", "selector": "object"}, "ExternalRef": {"apiVersion": "string", "kind": "string", "metadata": "ExternalRefMetadata"}, "Resource": {"id": "string | required=true", "template": "any", "patch": "any", "ref": "any", "watch": "any", "def": "any", "externalRef": "ExternalRef", "readyWhen": "[]string", "includeWhen": "[]string", "propagateWhen": "[]string", "forEach": "[]map[string]string"}, "PrinterColumn": {"name": "string | required=true", "type": "string | required=true", "jsonPath": "string | required=true", "description": "string", "format": "string", "priority": "integer"}}, "spec": {"schema": {"kind": "string | required=true pattern=\"^[A-Z][a-zA-Z0-9]{0,62}$\"", "apiVersion": "string", "group": "string | default=kro.run", "scope": "string | default=Namespaced", "spec": "object", "status": "object", "additionalPrinterColumns": "[]PrinterColumn"}, "resources": "[]Resource"}, "status": {"state": "string", "topologicalOrder": "[]string"}}, [])}
              subresources:
                status: {}
              additionalPrinterColumns:
                - name: APIVERSION
                  type: string
                  jsonPath: .spec.schema.apiVersion
                - name: KIND
                  type: string
                  jsonPath: .spec.schema.kind
                - name: STATE
                  type: string
                  jsonPath: .status.state
                - name: TOPOLOGICALORDER
                  type: string
                  priority: 1
                  jsonPath: .status.topologicalOrder
                - name: AGE
                  type: date
                  jsonPath: .metadata.creationTimestamp

    - id: watchRgds
      includeWhen:
        - ${has(rgdCrd.status) && has(rgdCrd.status.conditions) && rgdCrd.status.conditions.exists(c, c.type == 'Established' && c.status == 'True')}
      watch:
        apiVersion: kro.run/v1alpha1
        kind: ResourceGraphDefinition
        selector: {}

    - id: rgds
      forEach:
        - rgd: ${watchRgds}
      template:
        apiVersion: experimental.kro.run/v1alpha1
        kind: Graph
        metadata:
          name: rgd-${rgd.metadata.name}
          namespace: kro-system
          labels:
            kro.run/instance-name: ${rgd.metadata.name}
        spec:
          nodes:
            - id: schema
              ref:
                apiVersion: kro.run/v1alpha1
                kind: ResourceGraphDefinition
                metadata:
                  name: ${rgd.metadata.name}

            - id: checks
              def:
                resources: '$${has(schema.spec.resources) ? schema.spec.resources : []}'
                reserved: '$${["apiVersion","context","dependency","dependencies","each","externalRef","externalReference","externalRefs","externalReferences","graph","instance","item","items","kind","kro","metadata","namespace","object","resource","resourcegraphdefinition","resourceGraphDefinition","resources","root","runtime","schema","self","serviceAccountName","spec","status","this","variables","vars","version"]}'

            - id: validation
              def:
                result: >-
                  $${
                    checks.resources.exists(r, checks.reserved.exists(w, r.id == w))
                    ? {"valid": false, "message": "naming convention violation: id " + checks.resources.filter(r, checks.reserved.exists(w, r.id == w))[0].id + " is a reserved keyword in KRO"}
                    : checks.resources.exists(r, !r.id.matches("^[a-z][a-zA-Z0-9]*$"))
                    ? {"valid": false, "message": "naming convention violation: id " + checks.resources.filter(r, !r.id.matches("^[a-z][a-zA-Z0-9]*$"))[0].id + " is not a valid KRO resource id: must be lower camelCase"}
                    : has(schema.spec.schema.status) && schema.spec.schema.status.size() > 0 && schema.spec.schema.status.exists(k, !string(schema.spec.schema.status[k]).contains("${"))
                    ? {"valid": false, "message": "failed to build instance status schema: status fields without expressions are not supported"}
                    : {"valid": true, "message": ""}
                  }

            - id: crd
              includeWhen:
                - $${validation.result.valid}
              template:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: $${plural(schema.spec.schema.kind).lowerAscii()}.$${schema.spec.schema.group}
                  labels: '$${has(schema.spec.schema.metadata) && has(schema.spec.schema.metadata.labels) ? schema.spec.schema.metadata.labels : {}}'
                  annotations: '$${has(schema.spec.schema.metadata) && has(schema.spec.schema.metadata.annotations) ? schema.spec.schema.metadata.annotations : {}}'
                spec:
                  group: $${schema.spec.schema.group}
                  names:
                    kind: $${schema.spec.schema.kind}
                    plural: $${plural(schema.spec.schema.kind).lowerAscii()}
                  scope: $${schema.spec.schema.scope}
                  versions:
                    - name: $${schema.spec.schema.apiVersion}
                      served: true
                      storage: true
                      subresources:
                        status: {}
                      schema:
                        openAPIV3Schema: '$${simpleSchema.toOpenAPI(schema.spec.schema, has(schema.spec.resources) ? schema.spec.resources : [])}'
                      additionalPrinterColumns: '$${has(schema.spec.schema.additionalPrinterColumns) ? schema.spec.schema.additionalPrinterColumns : []}'

            - id: watchInstances
              includeWhen:
                - $${has(crd.status) && has(crd.status.conditions) && crd.status.conditions.exists(c, c.type == 'Established' && c.status == 'True')}
              watch:
                apiVersion: $${schema.spec.schema.group}/$${schema.spec.schema.apiVersion}
                kind: $${schema.spec.schema.kind}
                metadata:
                  selector: {}

            - id: instances
              forEach:
                - instance: $${watchInstances}
              template:
                apiVersion: experimental.kro.run/v1alpha1
                kind: Graph
                metadata:
                  name: >-
                    $${(has(instance.metadata.namespace) && instance.metadata.namespace != ""
                    ? instance.metadata.namespace + "-" : "")
                    + instance.metadata.name + "-" + schema.spec.schema.kind.lowerAscii()}
                  namespace: '$${has(instance.metadata.namespace) && instance.metadata.namespace != "" ? instance.metadata.namespace : "kro-system"}'
                  ownerReferences:
                    - apiVersion: '$${schema.spec.schema.group + "/" + schema.spec.schema.apiVersion}'
                      kind: '$${schema.spec.schema.kind}'
                      name: '$${instance.metadata.name}'
                      uid: '$${instance.metadata.uid}'
                      controller: true
                      blockOwnerDeletion: true
                spec:
                  nodes: >-
                    $${
                      [{"id": "schema", "ref": {
                        "apiVersion": schema.spec.schema.group + "/" + schema.spec.schema.apiVersion,
                        "kind": schema.spec.schema.kind,
                        "metadata": {
                          "name": instance.metadata.name,
                          "namespace": instance.metadata.namespace
                        }
                      }}]
                      + schema.spec.resources.filter(r, has(r.externalRef) && !has(r.externalRef.metadata.selector)).map(r,
                        {"id": r.id, "ref": {
                          "apiVersion": r.externalRef.apiVersion,
                          "kind": r.externalRef.kind,
                          "metadata": {"name": r.externalRef.metadata.name}.merge(
                            has(r.externalRef.metadata.namespace) && r.externalRef.metadata.namespace != ""
                              ? {"namespace": r.externalRef.metadata.namespace}
                              : {}
                          )
                        }})
                      + schema.spec.resources.filter(r, has(r.externalRef) && has(r.externalRef.metadata.selector)).map(r,
                        {"id": r.id, "watch": {
                          "apiVersion": r.externalRef.apiVersion,
                          "kind": r.externalRef.kind,
                          "selector": r.externalRef.metadata.selector
                        }.merge(
                          has(r.externalRef.metadata.namespace) && r.externalRef.metadata.namespace != ""
                            ? {"metadata": {"namespace": r.externalRef.metadata.namespace}}
                            : {}
                        )})
                      + schema.spec.resources.filter(r, !has(r.externalRef)).map(r, r.merge({
                        "propagateWhen": has(r.propagateWhen) ? r.propagateWhen : ["${" + r.id + ".dependencies().all(d, d.ready())}"],
                        "forceApply": true,
                        "template": r.template.merge({
                          "metadata": (has(r.template.metadata) ? r.template.metadata : {}).merge({
                            "labels": (has(r.template.metadata) && has(r.template.metadata.labels) ? r.template.metadata.labels : {}).merge({
                              "kro.run/instance-id": string(instance.metadata.uid),
                              "kro.run/instance-name": instance.metadata.name,
                              "kro.run/instance-namespace": instance.metadata.namespace,
                              "kro.run/instance-group": schema.spec.schema.group,
                              "kro.run/instance-version": schema.spec.schema.apiVersion,
                              "kro.run/instance-kind": schema.spec.schema.kind
                            })
                          })
                        })
                      }))
                      + [{"id": "rgdInstanceStatus",
                         "patch": {
                        "apiVersion": schema.spec.schema.group + "/" + schema.spec.schema.apiVersion,
                        "kind": schema.spec.schema.kind,
                        "metadata": {
                          "name": instance.metadata.name,
                          "namespace": instance.metadata.namespace
                        },
                        "status": {
                          "state": "${" + (schema.spec.resources.size() == 0 ? "true" : schema.spec.resources.map(r, r.id + ".ready()").join(" && ")) + " ? 'ACTIVE' : 'IN_PROGRESS'}",
                          "conditions": [
                            {
                              "type": "Ready",
                              "status": "${" + (schema.spec.resources.size() == 0 ? "true" : schema.spec.resources.map(r, r.id + ".ready()").join(" && ")) + " ? 'True' : 'False'}",
                              "reason": "Ready",
                              "observedGeneration": instance.metadata.generation,
                              "lastTransitionTime": instance.metadata.creationTimestamp
                            }
                          ]
                        }.merge(has(schema.spec.schema.status) ? schema.spec.schema.status : {})
                      }}]
                      + [{"id": "instanceLifecycle", "patch": {
                        "apiVersion": schema.spec.schema.group + "/" + schema.spec.schema.apiVersion,
                        "kind": schema.spec.schema.kind,
                        "metadata": {
                          "name": instance.metadata.name,
                          "namespace": instance.metadata.namespace,
                          "finalizers": ["experimental.kro.run/graph"]
                        }
                      }}]
                    }

            - id: rgdStatus
              propagateWhen:
                - '$${!validation.result.valid || crd.ready()}'
              patch:
                apiVersion: kro.run/v1alpha1
                kind: ResourceGraphDefinition
                metadata:
                  name: $${schema.metadata.name}
                status:
                  topologicalOrder: '$${validation.result.valid ? (has(schema.spec.resources) ? schema.spec.resources.map(r, r.id) : []) : []}'
                  conditions:
                    - type: GraphAccepted
                      status: '$${validation.result.valid ? "True" : "False"}'
                      reason: '$${validation.result.valid ? "Valid" : "Invalid"}'
                      message: '$${validation.result.valid ? "resource graph and schema are valid" : validation.result.message}'
                      observedGeneration: $${schema.metadata.generation}
                      lastTransitionTime: $${schema.metadata.creationTimestamp}
                    - type: KindReady
                      status: '$${validation.result.valid ? "True" : "False"}'
                      reason: '$${validation.result.valid ? "Ready" : "Invalid"}'
                      message: '$${validation.result.valid ? "" : validation.result.message}'
                      observedGeneration: $${schema.metadata.generation}
                      lastTransitionTime: $${schema.metadata.creationTimestamp}
                    - type: ControllerReady
                      status: "True"
                      reason: Running
                      message: controller is running
                      observedGeneration: $${schema.metadata.generation}
                      lastTransitionTime: $${schema.metadata.creationTimestamp}

    # Single writer for Ready and state on the RGD. Reduces validation
    # (computed here from rgd.spec) and compilation (from sub-Graph
    # status, written to RGD by compiledCondition) into one patch.
    - id: rgdPatch
      forEach:
        - rgd: ${watchRgds}
      forceApply: true
      patch:
        apiVersion: kro.run/v1alpha1
        kind: ResourceGraphDefinition
        metadata:
          name: ${rgd.metadata.name}
        status:
          state: >-
            ${(has(rgd.spec.resources) ? rgd.spec.resources : []).exists(r,
              ["apiVersion","context","dependency","dependencies","each","externalRef","externalReference","externalRefs","externalReferences","graph","instance","item","items","kind","kro","metadata","namespace","object","resource","resourcegraphdefinition","resourceGraphDefinition","resources","root","runtime","schema","self","serviceAccountName","spec","status","this","variables","vars","version"].exists(w, r.id == w)
              || !r.id.matches("^[a-z][a-zA-Z0-9]*$"))
            || (has(rgd.spec.schema.status) && rgd.spec.schema.status.size() > 0 && rgd.spec.schema.status.exists(k, !string(rgd.spec.schema.status[k]).contains("${")))
            ? "Inactive"
            : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "False")
            ? "Inactive"
            : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "True")
            ? "Active"
            : "Inactive"}
          conditions:
            - type: Ready
              status: >-
                ${(has(rgd.spec.resources) ? rgd.spec.resources : []).exists(r,
                  ["apiVersion","context","dependency","dependencies","each","externalRef","externalReference","externalRefs","externalReferences","graph","instance","item","items","kind","kro","metadata","namespace","object","resource","resourcegraphdefinition","resourceGraphDefinition","resources","root","runtime","schema","self","serviceAccountName","spec","status","this","variables","vars","version"].exists(w, r.id == w)
                  || !r.id.matches("^[a-z][a-zA-Z0-9]*$"))
                || (has(rgd.spec.schema.status) && rgd.spec.schema.status.size() > 0 && rgd.spec.schema.status.exists(k, !string(rgd.spec.schema.status[k]).contains("${")))
                ? "False"
                : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "False")
                ? "False"
                : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "True")
                ? "True"
                : "False"}
              reason: >-
                ${(has(rgd.spec.resources) ? rgd.spec.resources : []).exists(r,
                  ["apiVersion","context","dependency","dependencies","each","externalRef","externalReference","externalRefs","externalReferences","graph","instance","item","items","kind","kro","metadata","namespace","object","resource","resourcegraphdefinition","resourceGraphDefinition","resources","root","runtime","schema","self","serviceAccountName","spec","status","this","variables","vars","version"].exists(w, r.id == w)
                  || !r.id.matches("^[a-z][a-zA-Z0-9]*$"))
                ? "Invalid"
                : (has(rgd.spec.schema.status) && rgd.spec.schema.status.size() > 0 && rgd.spec.schema.status.exists(k, !string(rgd.spec.schema.status[k]).contains("${")))
                ? "Invalid"
                : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "False")
                ? "CompilationFailed"
                : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "True")
                ? "Ready"
                : "Reconciling"}
              message: >-
                ${(has(rgd.spec.resources) ? rgd.spec.resources : []).exists(r,
                  ["apiVersion","context","dependency","dependencies","each","externalRef","externalReference","externalRefs","externalReferences","graph","instance","item","items","kind","kro","metadata","namespace","object","resource","resourcegraphdefinition","resourceGraphDefinition","resources","root","runtime","schema","self","serviceAccountName","spec","status","this","variables","vars","version"].exists(w, r.id == w))
                ? "naming convention violation: id " + (has(rgd.spec.resources) ? rgd.spec.resources : []).filter(r, ["apiVersion","context","dependency","dependencies","each","externalRef","externalReference","externalRefs","externalReferences","graph","instance","item","items","kind","kro","metadata","namespace","object","resource","resourcegraphdefinition","resourceGraphDefinition","resources","root","runtime","schema","self","serviceAccountName","spec","status","this","variables","vars","version"].exists(w, r.id == w))[0].id + " is a reserved keyword in KRO"
                : (has(rgd.spec.resources) ? rgd.spec.resources : []).exists(r, !r.id.matches("^[a-z][a-zA-Z0-9]*$"))
                ? "naming convention violation: id " + (has(rgd.spec.resources) ? rgd.spec.resources : []).filter(r, !r.id.matches("^[a-z][a-zA-Z0-9]*$"))[0].id + " is not a valid KRO resource id: must be lower camelCase"
                : (has(rgd.spec.schema.status) && rgd.spec.schema.status.size() > 0 && rgd.spec.schema.status.exists(k, !string(rgd.spec.schema.status[k]).contains("${")))
                ? "failed to build instance status schema: status fields without expressions are not supported"
                : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "False")
                ? rgd.status.conditions.filter(c, c.type == "Compiled")[0].message
                : has(rgd.status) && has(rgd.status.conditions) && rgd.status.conditions.exists(c, c.type == "Compiled" && c.status == "True")
                ? "resource graph and schema are valid"
                : "Waiting for graph compilation"}
