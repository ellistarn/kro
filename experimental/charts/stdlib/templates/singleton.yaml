# Singleton — declare a resource that should exist exactly once.
#
# Fan-in pattern: multiple Singleton CRs target the same resource
# (same GVK + namespace + name). A single long-lived Graph watches all
# Singletons, groups them by target identity, picks the winner per
# identity, and owns the target resource directly via a forEach template.
#
# The target is a template node in THIS Graph — not in any per-instance
# sub-Graph. When a Singleton CR is deleted, this Graph re-evaluates:
# if peers remain for that identity, the target persists with the new
# winner's template (force-applied in place). Only when ALL Singletons
# for an identity are gone does the forEach shrink and the target get
# pruned normally.
#
# Status writeback: a second forEach patches each Singleton CR with its
# active/claim status.
#
# Priority resolution: highest spec.priority wins. Ties broken by
# earliest metadata.creationTimestamp (first come, first served).
#
# Complexity: O(N) per Singleton change — one Graph, one watch.
# ─────────────────────────────────────────────────────────────────────
apiVersion: experimental.kro.run/v1alpha1
kind: Graph
metadata:
  name: singleton
  namespace: kro-system
spec:
  nodes:
    # The Singleton CRD — created by this Graph using simpleSchema.
    - id: crd
      template:
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: singletons.experimental.kro.run
        spec:
          group: experimental.kro.run
          names:
            plural: singletons
            singular: singleton
            kind: Singleton
            listKind: SingletonList
          scope: Namespaced
          versions:
            - name: v1alpha1
              served: true
              storage: true
              subresources:
                status: {}
              schema:
                openAPIV3Schema: >-
                  ${simpleSchema.toOpenAPI({
                    "apiVersion": "experimental.kro.run/v1alpha1",
                    "kind": "Singleton",
                    "spec": {
                      "priority": "integer | default=0",
                      "template": "object"
                    },
                    "status": {
                      "active": "boolean",
                      "claim": "string"
                    }
                  }, [])}
              additionalPrinterColumns:
                - name: Claim
                  type: string
                  jsonPath: .status.claim
                - name: Priority
                  type: integer
                  jsonPath: .spec.priority
                - name: Active
                  type: boolean
                  jsonPath: .status.active
                - name: Age
                  type: date
                  jsonPath: .metadata.creationTimestamp

    # Watch all Singleton CRs.
    - id: singletons
      includeWhen:
        - ${has(crd.status) && has(crd.status.conditions) && crd.status.conditions.exists(c, c.type == 'Established' && c.status == 'True')}
      watch:
        apiVersion: experimental.kro.run/v1alpha1
        kind: Singleton
        metadata:
          selector: {}

    # Flatten each singleton into {key, name, namespace, priority, creationTimestamp, identity, template}.
    # key = namespace/name composite for cross-namespace uniqueness.
    - id: claims
      forEach:
        - s: ${singletons}
      def:
        key: ${s.metadata.namespace + "/" + s.metadata.name}
        name: ${s.metadata.name}
        namespace: ${s.metadata.namespace}
        priority: ${s.spec.priority}
        creationTimestamp: ${s.metadata.creationTimestamp}
        template: ${s.spec.template}
        identity: >-
          ${s.spec.template.apiVersion
            + (has(s.spec.template.metadata.namespace)
               ? "/namespaces/" + s.spec.template.metadata.namespace
               : "")
            + "/" + s.spec.template.kind
            + "/" + s.spec.template.metadata.name}

    # Apply one target resource per unique identity, using the winner's template.
    # Filter claims to only include winners: a claim is the winner if its key
    # matches the first entry after sorting by priority desc, creationTimestamp asc.
    # This produces exactly one entry per unique target identity.
    - id: targets
      forEach:
        - c: >-
            ${claims.filter(c,
              c.key == claims.filter(x, x.identity == c.identity)
                .sortBy(x, x.creationTimestamp)
                .sortBy(x, -x.priority)[0].key)}
      lifecycle:
        apply: Force
      template: "${c.template}"

    # Status writeback — patch each Singleton CR with active + claim.
    # Iterates over claims (which already carry computed identity) to avoid
    # re-deriving the identity formula.
    - id: status
      forEach:
        - c: ${claims}
      patch:
        apiVersion: experimental.kro.run/v1alpha1
        kind: Singleton
        metadata:
          name: ${c.name}
          namespace: ${c.namespace}
        status:
          active: >-
            ${c.key == claims.filter(x, x.identity == c.identity)
              .sortBy(x, x.creationTimestamp)
              .sortBy(x, -x.priority)[0].key}
          claim: "${c.identity}"
