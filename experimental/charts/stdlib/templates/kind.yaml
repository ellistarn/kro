# Kind Controller
#
# The bootstrap root. A Graph that implements the Kind type. Creates the
# Kind CRD, watches all Kinds, creates a CRD per Kind, watches instances
# of each Kind, and creates per-instance Graphs.
#
# Status propagation: kindConditions (at this level) hoists the controller
# Graph's Compiled/Ready conditions onto the Kind resource. kindCount
# (inside each controller Graph) writes the instance count.
#
# Convention: inside a Kind's per-instance Graph, `schema` is the scope
# variable (the resource itself). User nodes reference ${schema.spec.foo}.
---
apiVersion: experimental.kro.run/v1alpha1
kind: Graph
metadata:
  name: kind
  namespace: kro-system
spec:
  nodes:
    - id: kindCrd
      template:
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: kinds.experimental.kro.run
        spec:
          group: experimental.kro.run
          names:
            plural: kinds
            singular: kind
            kind: Kind
            listKind: KindList
          scope: Cluster
          versions:
            - name: v1alpha1
              served: true
              storage: true
              schema:
                openAPIV3Schema: >-
                  ${simpleSchema.toOpenAPI({"types": {"Node": {"id": "string", "template": "any", "patch": "any", "ref": "any", "watch": "any", "def": "any", "forEach": "[]map[string]string", "finalizes": "string", "includeWhen": "[]string", "readyWhen": "[]string", "propagateWhen": "[]string"}, "PrinterColumn": {"name": "string | required=true", "type": "string | required=true", "jsonPath": "string | required=true", "description": "string", "format": "string", "priority": "integer"}, "Condition": {"type": "string | required=true", "status": "string | required=true", "reason": "string", "message": "string", "lastTransitionTime": "string", "observedGeneration": "integer"}}, "spec": {"scope": "string | default=Namespaced", "schema": {"apiVersion": "string | required=true pattern=^[a-z][a-z0-9.-]*/[a-z][a-z0-9]*$", "kind": "string | required=true", "spec": "object", "status": "object | default={}", "types": "object"}, "propagateWhen": "[]string | default=[]", "nodes": "[]Node", "additionalPrinterColumns": "[]PrinterColumn | default=[]"}, "status": {"items": "integer", "conditions": "[]Condition"}}, [])}
              subresources:
                status: {}
              additionalPrinterColumns:
                - name: APIVersion
                  type: string
                  jsonPath: .spec.schema.apiVersion
                - name: Kind
                  type: string
                  jsonPath: .spec.schema.kind
                - name: Scope
                  type: string
                  jsonPath: .spec.scope
                - name: Compiled
                  type: string
                  jsonPath: .status.conditions[?(@.type=="Compiled")].status
                - name: Ready
                  type: string
                  jsonPath: .status.conditions[?(@.type=="Ready")].status
                - name: Items
                  type: integer
                  jsonPath: .status.items
                - name: Age
                  type: date
                  jsonPath: .metadata.creationTimestamp

    - id: watchKinds
      includeWhen:
        - ${has(kindCrd.status) && has(kindCrd.status.conditions) && kindCrd.status.conditions.exists(c, c.type == 'Established' && c.status == 'True')}
      # No metadata.namespace: watch Kinds across all namespaces
      # (k8s list/watch semantics — absent namespace = all).
      watch:
        apiVersion: experimental.kro.run/v1alpha1
        kind: Kind
        selector: {}

    - id: controllers
      forEach:
        - k: ${watchKinds}
      template:
        apiVersion: experimental.kro.run/v1alpha1
        kind: Graph
        metadata:
          name: kind.${k.metadata.name}
          namespace: kro-system
        spec:
          nodes:
            - id: k
              ref:
                apiVersion: experimental.kro.run/v1alpha1
                kind: Kind
                metadata:
                  name: ${k.metadata.name}

            - id: crd
              template:
                apiVersion: apiextensions.k8s.io/v1
                kind: CustomResourceDefinition
                metadata:
                  name: ${${plural(k.spec.schema.kind).lowerAscii()}}.${${k.spec.schema.apiVersion.split('/')[0]}}
                spec:
                  group: ${${k.spec.schema.apiVersion.split('/')[0]}}
                  names:
                    kind: ${${k.spec.schema.kind}}
                    plural: ${${plural(k.spec.schema.kind).lowerAscii()}}
                  scope: ${${k.spec.scope}}
                  versions:
                    - name: ${${k.spec.schema.apiVersion.split('/')[1]}}
                      served: true
                      storage: true
                      subresources:
                        status: {}
                      schema:
                        openAPIV3Schema: ${${simpleSchema.toOpenAPI(k.spec.schema, k.spec.nodes)}}
                      additionalPrinterColumns: '${${k.spec.additionalPrinterColumns}}'

            - id: watchInstances
              includeWhen:
                - ${${has(crd.status) && has(crd.status.conditions) && crd.status.conditions.exists(c, c.type == 'Established' && c.status == 'True')}}
              # No metadata.namespace: watch items of this Kind
              # across all namespaces (k8s list/watch semantics —
              # absent namespace = all).
              watch:
                apiVersion: ${${k.spec.schema.apiVersion}}
                kind: ${${k.spec.schema.kind}}
                metadata:
                  selector: {}

            - id: instances
              forEach:
                - instance: ${${watchInstances}}
              propagateWhen: "${k.spec.propagateWhen}"
              template:
                apiVersion: experimental.kro.run/v1alpha1
                kind: Graph
                metadata:
                  name: ${${"kind." + k.metadata.name + "." + instance.metadata.name}}
                  namespace: '${${k.spec.scope == "Namespaced" ? instance.metadata.namespace : "kro-system"}}'
                  ownerReferences:
                    - apiVersion: '${${k.spec.schema.apiVersion}}'
                      kind: "${${k.spec.schema.kind}}"
                      name: "${${instance.metadata.name}}"
                      uid: "${${instance.metadata.uid}}"
                      controller: true
                      blockOwnerDeletion: true
                spec:
                  nodes: >-
                    ${${
                      [{"id": "schema", "ref": {
                        "apiVersion": k.spec.schema.apiVersion,
                        "kind": k.spec.schema.kind,
                        "metadata": {
                          "name": instance.metadata.name,
                          "namespace": instance.metadata.?namespace.orValue("")
                        }
                      }}]
                      + k.spec.nodes
                      + [{"id": "kindInstancePatch", "patch": {
                          "apiVersion": k.spec.schema.apiVersion,
                          "kind": k.spec.schema.kind,
                          "metadata": {
                            "name": instance.metadata.name,
                            "namespace": instance.metadata.?namespace.orValue(""),
                            "finalizers": ["experimental.kro.run/graph"]
                          },
                          "status": k.spec.schema.status
                        }}]
                    }}

            - id: kindCount
              patch:
                apiVersion: experimental.kro.run/v1alpha1
                kind: Kind
                metadata:
                  name: ${${k.metadata.name}}
                status:
                  items: ${${watchInstances.size()}}

    # Hoist each controller Graph's conditions onto its Kind resource.
    # Iterates over the observed controller Graphs and forwards their
    # Compiled/Ready conditions directly.
    - id: kindConditions
      forEach:
        - graph: ${controllers}
      patch:
        apiVersion: experimental.kro.run/v1alpha1
        kind: Kind
        metadata:
          # Controller Graphs are named "kind.<kindname>". Strip the 5-char
          # prefix to recover the Kind resource name.
          name: ${graph.metadata.name.substring(5)}
        status:
          conditions:
            - ${graph.status.conditions.filter(c, c.type == 'Compiled')[0]}
            - ${graph.status.conditions.filter(c, c.type == 'Ready')[0]}
