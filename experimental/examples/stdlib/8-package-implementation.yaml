        rules:
          - apiGroups: ["experimental.kro.run"]
            resources: ["graphs", "graphs/status", "graphrevisions", "graphrevisions/status"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["*"]
            resources: ["*"]
            verbs: ["get", "list", "watch", "create", "patch", "delete"]
          - apiGroups: ["*"]
            resources: ["*/status"]
