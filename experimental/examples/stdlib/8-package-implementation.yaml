                    limits:
                      memory: 512Mi
#
# Both Singletons feed into the Singleton Decorator (file 7):
#   sort by priority: [kro-v0-2-1 (2001), kro-v0-2-0 (2000)]
#   flatMap nodes: [v0.2.1's Namespace, CRD, SA, ... , v0.2.0's Namespace, CRD, SA, ...]
#   distinct by GVKNN: [v0.2.1's Namespace, v0.2.1's CRD, v0.2.1's SA, ...]
#   forEach: create v0.2.1's resources. v0.2.0's are dropped by distinct.
