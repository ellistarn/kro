# GraphDefinition — define a Kind and implement it.
#
# Always produces a CRD + Graph. The CRD is the point.
# `schema` is the per-instance scope variable (the resource IS
# an instance of the defined schema).
---
apiVersion: experimental.kro.run/v1alpha1
kind: GraphDefinition
metadata:
  name: webapp
spec:
  kind: WebApp
  group: experimental.kro.run
  versions:
    - name: v1alpha1
      schema:
        spec:
          image: string | default=nginx
          replicas: integer | default=1
          port: integer | default=80
        status:
          deploymentReady: ${deployment.status.availableReplicas == deployment.spec.replicas}
  nodes:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
            spec:
              containers:
                - name: app
                  image: ${schema.spec.image}
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-svc
        spec:
          selector:
            app: ${schema.metadata.name}
          ports:
            - port: ${schema.spec.port}
