# Package — a versioned bundle of resources installed exactly once.
#
# Package uses semver. The version determines priority:
#   - Major version conflicts → status condition (breaking change, manual resolution)
#   - Minor/patch conflicts → auto-resolves to highest version
#
# When multiple Packages with the same name exist (e.g., two things both
# install kro), the system picks the highest compatible version. Losers
# get status indicating they were superseded. Major version conflicts
# get a status condition requiring manual intervention.
#
# Implementation: Package IS a Singleton. Semver converts to priority:
#   priority = major * 1000000 + minor * 1000 + patch
# This preserves ordering: v1.0.0 (1000000) > v0.999.999 (999999).
# The Singleton machinery (sort + distinct) handles the rest.
#
# Major version conflicts are detected before conversion: if two Packages
# share a name but differ in major version, both get MajorVersionConflict
# status and neither produces a Singleton.
#
# Resolution rules:
#   Same major → semver → priority → Singleton resolution (highest wins)
#   Different major → MajorVersionConflict condition, no Singleton created
#   Same version → creation timestamp breaks tie (oldest wins, stable)
#
# ───────────────────────────────────────────────────────────────────
# Install kro. Multiple actors can declare this — the highest
# compatible version wins.
# ───────────────────────────────────────────────────────────────────
---
apiVersion: experimental.kro.run/v1alpha1
kind: Package
metadata:
  name: kro
spec:
  version: v0.2.0
  nodes:
    - id: namespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: kro-system

    - id: graphsCRD
      template:
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: graphs.experimental.kro.run
        spec:
          group: experimental.kro.run
          names:
            plural: graphs
            singular: graph
            kind: Graph
            listKind: GraphList
          scope: Namespaced
          versions:
            - name: v1alpha1
              served: true
              storage: true
              schema:
                openAPIV3Schema:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              subresources:
                status: {}

    - id: graphRevisionsCRD
      template:
        apiVersion: apiextensions.k8s.io/v1
        kind: CustomResourceDefinition
        metadata:
          name: graphrevisions.experimental.kro.run
        spec:
          group: experimental.kro.run
          names:
            plural: graphrevisions
            singular: graphrevision
            kind: GraphRevision
            listKind: GraphRevisionList
          scope: Namespaced
          versions:
            - name: v1alpha1
              served: true
              storage: true
              schema:
                openAPIV3Schema:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              subresources:
                status: {}

    - id: serviceAccount
      template:
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: graph-controller
          namespace: kro-system

    - id: clusterRole
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: graph-controller
        rules:
          - apiGroups: ["experimental.kro.run"]
            resources: ["graphs", "graphs/status"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["experimental.kro.run"]
            resources: ["graphrevisions", "graphrevisions/status"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
          - apiGroups: ["*"]
            resources: ["*"]
            verbs: ["get", "list", "watch", "create", "patch", "delete"]
          - apiGroups: ["*"]
            resources: ["*/status"]
            verbs: ["get", "patch"]
          - apiGroups: [""]
            resources: ["events"]
            verbs: ["create", "patch"]
          - apiGroups: ["coordination.k8s.io"]
            resources: ["leases"]
            verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

    - id: clusterRoleBinding
      template:
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: graph-controller
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: graph-controller
        subjects:
          - kind: ServiceAccount
            name: graph-controller
            namespace: kro-system

    - id: controller
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: graph-controller
          namespace: kro-system
          labels:
            app: graph-controller
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: graph-controller
          template:
            metadata:
              labels:
                app: graph-controller
            spec:
              serviceAccountName: graph-controller
              containers:
                - name: controller
                  image: ko://github.com/kubernetes-sigs/kro/experimental/cmd
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
---
# ───────────────────────────────────────────────────────────────────
# A second actor also depends on kro, but at a newer patch version.
# This wins automatically (same major, higher minor.patch).
# ───────────────────────────────────────────────────────────────────
apiVersion: experimental.kro.run/v1alpha1
kind: Package
metadata:
  name: kro
  # Different metadata.name would make this a different Package.
  # Same metadata.name means these are competing declarations of kro.
  # But we need to distinguish the actors — so maybe the Package name
  # is the package identity and the metadata.name is the actor identity.
  #
  # TODO: resolve naming — Package identity (what's being installed) vs
  # actor identity (who's installing it). For now, assume Package name
  # field in spec determines the package identity.
spec:
  version: v0.2.1
  nodes:
    # Same resources as above, but maybe a newer image tag.
    # The entire node set from the winning version is applied.
    - id: namespace
      template:
        apiVersion: v1
        kind: Namespace
        metadata:
          name: kro-system
    # ... (same CRDs, RBAC, etc.)
    - id: controller
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: graph-controller
          namespace: kro-system
          labels:
            app: graph-controller
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: graph-controller
          template:
            metadata:
              labels:
                app: graph-controller
            spec:
              serviceAccountName: graph-controller
              containers:
                - name: controller
                  image: ko://github.com/kubernetes-sigs/kro/experimental/cmd
                  resources:
                    requests:
                      cpu: 100m
                      memory: 128Mi
                    limits:
                      memory: 512Mi
#
# Result:
#   Package/kro v0.2.1 wins (higher patch, same major)
#   Package/kro v0.2.0 status: Superseded by v0.2.1
#
# If someone installs Package/kro v1.0.0:
#   MajorVersionConflict condition on both v0.x and v1.x Packages
#   No auto-resolution — operator must decide
