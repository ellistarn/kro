# 5. A ResourceGraphDefinition (kro compat)
#
# The existing kro API. What a platform engineer creates in upstream kro
# today. Example 6's ResourceGraphDefinition system watches these and
# creates a controller Graph per ResourceGraphDefinition.
#
# GraphDefinition (example 4) is the experimental successor — same
# concepts, with multi-version CRD support and cleaner separation of
# schema versioning from node composition.
apiVersion: experimental.kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: webapp-rgd
spec:
  schema:
    kind: WebApp
    apiVersion: v1alpha1
    group: experimental.kro.run
    spec:
      image: string | default=nginx
      replicas: integer | default=1
      port: integer | default=80
    status:
      deploymentReady: ${deployment.status.availableReplicas == deployment.spec.replicas}
  resources:
    - id: deployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.metadata.name}
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app: ${schema.metadata.name}
          template:
            metadata:
              labels:
                app: ${schema.metadata.name}
            spec:
              containers:
                - name: app
                  image: ${schema.spec.image}
    - id: service
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.metadata.name}-svc
        spec:
          selector:
            app: ${schema.metadata.name}
          ports:
            - port: ${schema.spec.port}
